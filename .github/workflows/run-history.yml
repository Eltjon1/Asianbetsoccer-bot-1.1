name: Build AsianBetSoccer History

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Data iniziale YYYY-MM-DD'
        required: true
        default: '2025-01-01'

      end_date:
        description: 'Data finale YYYY-MM-DD (lascia vuoto = oggi)'
        required: false
        default: ''

      save_raw:
        description: 'Salva anche i file JS giornalieri: 1 si, 0 no'
        required: true
        default: '1'

jobs:
  build-history:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run archive bot
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          SAVE_RAW: ${{ inputs.save_raw }}
          DELAY_MS: 400
        run: |
          if [ -z "$END_DATE" ]; then unset END_DATE; fi
          node bot-history.js

      - name: Upload archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asianbetsoccer-history-${{ github.run_number }}
          path: archive/
          retention-days: 30
