name: Run AsianBetSoccer Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run bot
        run: node bot.js

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asianbetsoccer-getData2
          path: |
            tablefunc.js
            getData2-function.txt
